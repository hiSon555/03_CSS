<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="03-pseudo.css"/>
</head>
<body>
<h2>:hover (마우스를 올린 상태)</h2>
<button class="btn">주문하기</button>

<h2>:focus (입력 칸을 사용자가 선택 중인 상태)</h2>
<input placeholder="이름을 입력해보세요" />

<h2>:first-child, :last-child, :nth-child</h2>
<ul>
    <li>첫 번째</li>            <!-- ul의 첫 번째 자식이 아닌, 첫 번째 자식인 li라고 이해해야 함 -->
    <li>두 번째</li>
    <li>세 번째</li>
    <li>네 번째</li>
    <li>다섯 번째</li>
</ul>

</body>
</html>
