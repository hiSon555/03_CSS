<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="list-container">
        <div class="list-header">
            <div class="header-title">
                <h2>Device Management</h2>
                <span class="device-count">Total 4 Devices</span>
            </div>
            <button class="btn-add">+ Add Device</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th>DEVICE NAME</th>
                <th>LOCATION</th>
                <th>STATUS</th>
                <th>BATTERY</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <div class="device-info">
                    <div class="icon-box icon-light"></div>
                    <span class="device-name">Smart Bulb A</span>
                    </div>
                </td>
                <td class="location">Living Room</td>
                <td>
                    <div class="status-badge badge-online"> <!-- block요소이기에 가로를 다 먹고 있음 -->
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div>
                            <div class="battery-bar">
                                <div class="battery-fill" style="width: 85%"></div>
                            </div>
                        </div>
                        <span class="battery-text">85%</span>
                    </div>
                </td>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-thermostat"></div>
                        <span class="device-name">Main Thermostat</span>
                    </div>
                </td>
                <td class="location">Hallway</td>
                <td>
                    <div class="status-badge badge-offline"> <!-- block요소이기에 가로를 다 먹고 있음 -->
                        <div class="status-dot"></div>
                        <span>Offline</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div>
                            <div class="battery-bar">
                                <div class="battery-fillbad" style="width: 15%"></div>
                            </div>
                        </div>
                        <span class="battery-text">15%</span>
                    </div>
                </td>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-plug"></div>
                        <span class="device-name">Coffee maker plug</span>
                    </div>
                </td>
                <td class="location">Kitchen</td>
                <td>
                    <div class="status-badge badge-online"> <!-- block요소이기에 가로를 다 먹고 있음 -->
                        <div class="status-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-pluggedin">
                        <span>Plugged in</span>
                    </div>
                </td>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-camera"></div>
                        <span class="device-name">Front Door Camera</span>
                    </div>
                </td>
                <td class="location">Porch</td>
                <td>
                    <div class="status-badge badge-standby"> <!-- block요소이기에 가로를 다 먹고 있음 -->
                        <div class="status-dot"></div>
                        <span>Standby</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div>
                            <div class="battery-bar">
                                <div class="battery-fill" style="width: 60%"></div>
                            </div>
                        </div>
                        <span class="battery-text">60%</span>
                    </div>
                </td>
                <td>
                    <button class="btn-edit">Edit</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
