<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/86abaed617.js" crossorigin="anonymous"></script>
    <!-- 여기에 벡터 아이콘 소스    -->
</head>
<body>
    <aside>
        <div class="logo">
            <i class="fa-solid fa-cube brand-icon"></i>
            <span>MyDash</span>
        </div>
        <nav>
            <ul>
                <li class="active">
                    <i class="fa-regular fa-id-badge"></i>
                    <span>Profile Info</span>
                </li>
                <li>
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>Account Security</span>
                </li>
                <li>
                    <i class="fa-regular fa-bell"></i>
                    <span>Notifications</span>
                </li>
                <li>
                    <i class="fa-solid fa-credit-card"></i>
                    <span>Billing Details</span>
                </li>
            </ul>
        </nav>
    </aside>
    <main>
        <header>
            <div class="header-text">
                <h2>Profile Information</h2>
                <span>Update your photo and personal details.</span>
            </div>
            <div class="user-shortcut">
                <i class="fa-solid fa-magnifying-glass"></i>
                <div class="user-avatar-small">A</div>
            </div>
        </header>
        <div class="content-wrapper">
            <div class="content-main flex-col">
                <div class="data flex-row">
                    <div class="profile flex-row">A</div>
                    <button class="btn upload flex-row">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span>Upload</span>
                    </button>
                    <button class="btn flex-row remove">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Remove</span>
                    </button>
                </div>
                <div class="user-info flex-col">
                    <div class="flex-row full-name">
                        <div class="input-default flex-col first-name">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name">
                        </div>
                        <div class="input-default flex-col last-name">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name">
                        </div>
                    </div>
                    <div class="input-default flex-col email">
                        <label for="email">Email</label>
                        <input type="email" id="email" class="data-input" placeholder="abc@defg.com">
                    </div>
                    <div class="input-default flex-col phone-number">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" class="data-input" placeholder="010-1234-5678">
                    </div>
                    <div class="flex-row subscribe">
                        <input type="checkbox">
                        <span>Receive updates and newsletters via email</span>
                    </div>
                </div>
                <div class="flex-row confirm-dialog">
                    <button class="cancel-btn">Cancel</button>
                    <button class="save-btn">Save Changes</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
